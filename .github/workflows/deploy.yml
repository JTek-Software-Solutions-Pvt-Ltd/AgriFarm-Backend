
name: Deploy Kisan Dost Backend

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        shell: bash
        env:
          VM_SSH_PRIVATE_KEY: ${{ secrets.AZURE_VM_SSH_PRIVATE_KEY }}
          VM_KNOWN_HOSTS: ${{ secrets.AZURE_VM_KNOWN_HOSTS }}
        run: |
          set -e
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$VM_SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

          printf '%s\n' "$VM_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          echo "SSH configured."

      - name: Deploy backend
        shell: bash
        env:
          VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          VM_USER: ${{ secrets.AZURE_VM_USER }}
        run: |
          set -e

          cat > /tmp/deploy_remote.sh <<'REMOTE_SCRIPT'
          set -euo pipefail

          cd /home/azureuser/kisandost/backend

          echo "Fetching latest GitHub code..."
          git fetch origin main

          echo "Updating application to origin/main..."
          git merge --ff-only origin/main

          echo "Installing production dependencies..."
          npm install --omit=dev

          echo "Restarting backend..."
          pm2 restart kisandost-backend --update-env

          echo "Waiting for backend..."
          ready=0

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7000/api-docs/ -o /dev/null; then
              ready=1
              break
            fi
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            echo "Backend did not become ready."
            pm2 logs kisandost-backend --lines 50 --nostream
            exit 1
          fi

          echo "Deployed commit:"
          git rev-parse HEAD

          echo "Deployment successful!"
          REMOTE_SCRIPT

          echo "Connecting to Azure VM..."

          ssh -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$VM_USER@$VM_HOST" 'bash -s' < /tmp/deploy_remote.sh

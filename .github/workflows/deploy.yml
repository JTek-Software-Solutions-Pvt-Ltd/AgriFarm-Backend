- name: Deploy backend
  shell: bash
  env:
          VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          VM_USER: ${{ secrets.AZURE_VM_USER }}
        run: |
          set -e
 
          if [ -z "$VM_HOST" ]; then
            echo "ERROR: AZURE_VM_HOST secret is missing"
            exit 1
          fi
 
          if [ -z "$VM_USER" ]; then
            echo "ERROR: AZURE_VM_USER secret is missing"
            exit 1
          fi
 
          echo "Connecting to Azure VM..."
 
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$VM_USER@$VM_HOST" 'bash -se' <<'REMOTE'
            set -e
 
            cd /home/azureuser/kisandost/backend
 
            echo "Pulling latest code..."
            git pull --ff-only origin main
 
            echo "Installing production dependencies..."
            npm install --omit=dev
 
            echo "Restarting backend..."
            pm2 restart kisandost-backend --update-env
 
            echo "Checking backend..."
            curl -fsS http://127.0.0.1:7000/api-docs/ -o /dev/null
 
            echo "Deployment successful!"
          REMOTE

name: Deploy Kisan Dost Backend

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - Develop

permissions:
  contents: read

# Both branches use the same folder, so only one deploy can run at a time
concurrency:
  group: deploy-kisandost
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ github.ref_name }} to Azure VM
    runs-on: ubuntu-latest

    steps:
      - name: Set environment based on branch
        shell: bash
        run: |
          set -e
          BRANCH="${{ github.ref_name }}"

          if [ "$BRANCH" != "main" ] && [ "$BRANCH" != "Develop" ]; then
            echo "Branch '$BRANCH' is not configured for deployment."
            exit 1
          fi

          echo "APP_DIR=/home/azureuser/kisandost/backend" >> "$GITHUB_ENV"
          echo "PM2_NAME=kisandost-backend" >> "$GITHUB_ENV"
          echo "APP_PORT=7000" >> "$GITHUB_ENV"
          echo "DEPLOY_BRANCH=$BRANCH" >> "$GITHUB_ENV"

      - name: Configure SSH
        shell: bash
        env:
          VM_SSH_PRIVATE_KEY: ${{ secrets.AZURE_VM_SSH_PRIVATE_KEY }}
          VM_KNOWN_HOSTS: ${{ secrets.AZURE_VM_KNOWN_HOSTS }}
        run: |
          set -e
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$VM_SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

          printf '%s\n' "$VM_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          echo "SSH configured."

      - name: Deploy backend
        shell: bash
        env:
          VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          VM_USER: ${{ secrets.AZURE_VM_USER }}
        run: |
          set -e

          cat > /tmp/deploy_remote.sh <<'REMOTE_SCRIPT'
          set -euo pipefail

          APP_DIR="$1"
          BRANCH="$2"
          PM2_NAME="$3"
          APP_PORT="$4"

          cd "$APP_DIR"

          echo "Fetching latest GitHub code for $BRANCH..."
          git fetch origin "$BRANCH"

          echo "Switching to $BRANCH and updating to origin/$BRANCH..."
          git checkout -B "$BRANCH" "origin/$BRANCH"

          echo "Installing production dependencies..."
          npm install --omit=dev

          echo "Restarting backend ($PM2_NAME)..."
          pm2 restart "$PM2_NAME" --update-env

          echo "Waiting for backend on port $APP_PORT..."
          ready=0

          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${APP_PORT}/api-docs/" -o /dev/null; then
              ready=1
              break
            fi
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            echo "Backend did not become ready."
            pm2 logs "$PM2_NAME" --lines 50 --nostream
            exit 1
          fi

          echo "Deployed commit:"
          git rev-parse HEAD

          echo "Deployment successful!"
          REMOTE_SCRIPT

          ssh -i "$HOME/.ssh/deploy_key" \
            -o StrictHostKeyChecking=yes \
            "$VM_USER@$VM_HOST" \
            "bash -s -- '$APP_DIR' '$DEPLOY_BRANCH' '$PM2_NAME' '$APP_PORT'" \
            < /tmp/deploy_remote.sh
